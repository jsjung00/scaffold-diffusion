defaults:
  - _self_
  - /callbacks: [checkpoint_monitor] #[checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: minecraft
  - /model: latent_diffusion #latent_diffusion / sparse_vae
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: constant_warmup

mode: train  # train / sample_eval
diffusion: absorbing_state
backbone: dit_3d  # unet / dit_3d
parameterization: subs  # subs / d3pm / sedd
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
subs_masking: False
mask_token_id: null # 0 for air 
air_weight: 0.5 # weighting loss on air token by this ratio  
overfit: False  #False

# naming
model_name: latent_diffusion #latent_diffusion / sparse_vae 

seed: 1

latent:
  vae_ckpt: /home/jsjung00/Desktop/Code/voxeldiffusion/outputs/minecraft/2025.06.22/165728/checkpoints/sparse_vae_best.ckpt
  #vae_ckpt: /home/jsjung00/Desktop/Code/voxeldiffusion/outputs/minecraft/2025.06.20/200536/checkpoints/sparse_vae_best.ckpt
  diffusion_ckpt: /home/jsjung00/Desktop/Code/voxeldiffusion/outputs/minecraft/2025.06.21/182705/checkpoints/latent_diffusion_best.ckpt

loader:
  global_batch_size: 5
  eval_global_batch_size: 5
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: 5
  eval_batch_size: 5
  num_workers: 16
  pin_memory: True

sampling:
  predictor: ddpm_cache  # analytic, ddpm, ddpm_cache
  steps: 1028
  noise_removal: True
  # TODO(yair): @subham, why aren't these params under `eval`?
  num_sample_batches: 1  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1
  val_sample_freq: 10

training:
  use_ema: True 
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False

eval:
  checkpoint_path: '/home/jsjung00/Desktop/Code/voxeldiffusion/outputs/minecraft/2025.05.29/062609/checkpoints/best.ckpt'  
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True

optim:
  weight_decay: 0
  lr: 1e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: '32-true' # bf16-mixed / 32-true 
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 10
  #limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  #limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  check_val_every_n_epoch: 1 #5

wandb:
  project: voxel-diffusion
  notes: Voxel diffusion
  group: null
  job_type: null
  name: ${now:%Y.%m.%d}-${now:%H%M%S} 
  id: ${.name}_${seed}
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
