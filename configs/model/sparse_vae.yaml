model_name: sparse_vae 

loss_type: dice_focal 
lambda_kl: 0.001 #0.00001 / 0.001
weight_air: True # False / True 
air_weight: 0.9 #0.5

encoder:
  in_channels: 1
  latent_channels: 8 # 8 256 / 768 
  num_res_blocks: 2
  num_res_blocks_middle: 2
  channels: [32, 128, 512]  #[32, 128, 512] / [16, 32, 64, 128, 256, 512, 1024]
  #use_fp16: true 

decoder:
  out_channels: 1
  latent_channels: 8 # 8 / 768
  num_res_blocks: 2
  num_res_blocks_middle: 2
  channels: [512, 128, 32]  #[512, 128, 32] / [1024, 512, 256, 128, 64, 32, 16]
  #use_fp16: true 