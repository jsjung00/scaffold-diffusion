model_name: sparse_vae 

loss_type: bce 
lambda_kl: 1 #0.000001

encoder:
  in_channels: 1
  latent_channels: 8
  num_res_blocks: 2
  num_res_blocks_middle: 2
  channels: [32, 128, 512]
  #use_fp16: true 

decoder:
  out_channels: 1
  latent_channels: 8
  num_res_blocks: 2
  num_res_blocks_middle: 2
  channels: [512, 128, 32]
  #use_fp16: true 